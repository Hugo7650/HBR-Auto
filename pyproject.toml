[project]
name = "hbr-auto"
version = "0.2.0"
description = "Python-first automation framework for Heaven Burns Red, built on MaaFramework."
readme = "README.md"
requires-python = ">=3.15,<3.16"
dependencies = [
    "MaaFw==5.16.1",
    "numpy>=2.0,<3",
    "piexif>=1.1.3,<2",
    "py-lzstring>=0.1.1,<0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.4",
    "ruff>=0.14",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py315"
extend-exclude = ["logs", "data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
